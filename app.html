<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WLLT - Dompet, Transaksi & Asisten Keuangan</title>
  <meta name="description" content="Aplikasi mobile keuangan pribadi modern, catat transaksi cepat, tracking hutang piutang, goals tabungan, dan asisten AI pintar.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M21 7.28V5c0-1.1-.9-2-2-2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-2.28c.59-.35 1-.98 1-1.72V9c0-.74-.41-1.37-1-1.72zM20 9v6h-7V9h7z'/></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/wllt.css">

  <style>
    /* Standalone Web App / PWA View Mode */
    body.wllt-standalone-body {
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .wllt-standalone-topbar {
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wllt-standalone-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .wllt-standalone-brand .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }

    .wllt-standalone-brand h1 {
      font-size: 1.3rem;
      font-weight: 800;
      font-family: var(--font-heading);
      margin: 0;
      letter-spacing: -0.5px;
    }

    .wllt-standalone-brand p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin: 0;
      font-weight: 600;
    }

    .wllt-topbar-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wllt-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .wllt-back-link:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--primary);
    }

    .theme-round-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .theme-round-btn:hover {
      background: var(--bg-input);
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body class="dark-mode wllt-standalone-body">

  <!-- Standalone Topbar Navigation -->
  <header class="wllt-standalone-topbar">
    <a href="app.html" class="wllt-standalone-brand">
      <div class="brand-logo">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <div>
        <h1>WLLT<span style="color: #10b981;">.</span></h1>
        <p>Personal Finance & AI Assistant</p>
      </div>
    </a>

    <div class="wllt-topbar-tools">
      <a href="index.html" class="wllt-back-link" title="Buka Kalkulator Rumah Tangga">
        <i class="fa-solid fa-calculator"></i>
        <span>RumahBudget</span>
      </a>
      <button class="theme-round-btn" id="wlltThemeToggleBtn" title="Ganti Mode Gelap / Terang">
        <i class="fa-solid fa-sun"></i>
      </button>
    </div>
  </header>

  <!-- Main Standalone App Container -->
  <main id="wlltAppMountPoint" style="padding-top: 10px;"></main>

  <!-- Script Initializer -->
  <script type="module">
    import { DompetModule } from './js/modules/dompet.js';

    // Theme toggle logic
    const themeBtn = document.getElementById('wlltThemeToggleBtn');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
      document.body.classList.remove('dark-mode');
      document.body.classList.add('light-mode');
      themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.body.classList.contains('dark-mode');
      if (isDark) {
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
        themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        localStorage.setItem('theme', 'light');
      } else {
        document.body.classList.remove('light-mode');
        document.body.classList.add('dark-mode');
        themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        localStorage.setItem('theme', 'dark');
      }
    });

    // Render standalone WLLT App
    const mount = document.getElementById('wlltAppMountPoint');
    DompetModule.render(mount);
  </script>
</body>
</html>
